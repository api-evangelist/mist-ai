tags:
- description: 'Site templates are pre-configured sets of attributes and settings that can be applied to one or more sites in a Mist Organization.


    These templates allow for quick and consistent configuration of sites by grouping common attributes together.


    They can include settings such as Auto-Upgrade features, wan edge configurations, switch configurations and other network parameters.


    By applying a site template, the same configuration can be easily replicated across multiple sites, simplifying network management and ensuring consistency.'
  name: Orgs Site Templates
paths:
  /api/v1/orgs/{org_id}/sitetemplates:
    parameters:
    - $ref: '#/components/parameters/org_id'
    get:
      description: Get List of Org Site Templates
      operationId: listOrgSiteTemplates
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          $ref: '#/components/responses/SiteTemplatesArray'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: listOrgSiteTemplates
      tags:
      - Orgs Site Templates
    post:
      description: Create Org Site Template
      operationId: createOrgSiteTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site_template'
      responses:
        '200':
          $ref: '#/components/responses/SiteTemplate'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: createOrgSiteTemplate
      tags:
      - Orgs Site Templates
  /api/v1/orgs/{org_id}/sitetemplates/{sitetemplate_id}:
    parameters:
    - $ref: '#/components/parameters/org_id'
    - $ref: '#/components/parameters/sitetemplate_id'
    delete:
      description: Delete Org Site Template
      operationId: deleteOrgSiteTemplate
      responses:
        '200':
          $ref: '#/components/responses/OK'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: deleteOrgSiteTemplate
      tags:
      - Orgs Site Templates
    get:
      description: Get Org Site Template
      operationId: getOrgSiteTemplate
      responses:
        '200':
          $ref: '#/components/responses/SiteTemplate'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: getOrgSiteTemplate
      tags:
      - Orgs Site Templates
    put:
      description: Update Org Site Template
      operationId: updateOrgSiteTemplate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/site_template'
      responses:
        '200':
          $ref: '#/components/responses/SiteTemplate'
        '400':
          $ref: '#/components/responses/HTTP400'
        '401':
          $ref: '#/components/responses/HTTP401'
        '403':
          $ref: '#/components/responses/HTTP403'
        '404':
          $ref: '#/components/responses/HTTP404'
        '429':
          $ref: '#/components/responses/HTTP429'
      summary: updateOrgSiteTemplate
      tags:
      - Orgs Site Templates
components:
  responses:
    SiteTemplatesArray:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/SiteTemplatesArrayExample'
          schema:
            $ref: '#/components/schemas/site_templates'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/SiteTemplatesArrayExample'
          schema:
            $ref: '#/components/schemas/site_templates'
      description: Example response
    HTTP404:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/response_http404'
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/response_http404'
      description: Not found. The API endpoint doesn’t exist or resource doesn’ t exist
    HTTP429:
      content:
        application/json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
        application/vnd.api+json:
          examples:
            Example:
              $ref: '#/components/examples/HTTP429Example'
          schema:
            $ref: '#/components/schemas/response_http429'
