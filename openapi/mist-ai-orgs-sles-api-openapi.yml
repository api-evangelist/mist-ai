          type: string
      type: object
    org_site_sle_wan_result:
      additionalProperties: false
      properties:
        application_health:
          type: number
        gateway-health:
          type: number
        num_clients:
          type: number
        num_gateways:
          type: number
        site_id:
          $ref: '#/components/schemas/site_id'
        wan-link-health:
          type: number
      required:
      - site_id
      - gateway-health
      type: object
    org_site_wan_wifi:
      additionalProperties: false
      properties:
        end:
          type: number
        interval:
          type: integer
        limit:
          type: integer
        page:
          type: integer
        results:
          $ref: '#/components/schemas/org_site_sle_wan_results'
        start:
          type: number
        total:
          type: integer
      required:
      - start
      - end
      - interval
      - limit
      - page
      - total
      - results
      type: object
    org_site_sle_wifi_results:
      items:
        $ref: '#/components/schemas/org_site_sle_wifi_result'
      type: array
      uniqueItems: true
    insight_metrics_results:
      description: Results depends on the `metric` - some return numbers (e.g. bytes, ap-count), others return objects
      items:
        $ref: '#/components/schemas/insight_metrics_results_item'
      type: array
      uniqueItems: true
    response_org_site_sle:
      oneOf:
      - $ref: '#/components/schemas/org_site_sle_wifi'
      - $ref: '#/components/schemas/org_site_wired_wifi'
      - $ref: '#/components/schemas/org_site_wan_wifi'
    org_site_sle_wifi_result:
      additionalProperties: false
      properties:
        ap-availability:
          type: number
        ap-health:
          type: number
        capacity:
          type: number
        coverage:
          type: number
        num_aps:
          type: number
        num_clients:
          type: number
        roaming:
          type: number
        site_id:
          $ref: '#/components/schemas/site_id'
        successful-connect:
          type: number
        throughput:
          type: number
        time-to-connect:
          type: number
      required:
      - site_id
      - ap-availability
      type: object
    site_id:
      examples:
      - 441a1214-6928-442a-8e92-e1d34b8ec6a6
      format: uuid
      readOnly: true
      type: string
    response_http404:
      additionalProperties: false
      properties:
        id:
          type: string
      type: object
    org_site_sle_wired_result:
      additionalProperties: false
      properties:
        num_clients:
          type: number
        num_switches:
          type: number
        site_id:
          $ref: '#/components/schemas/site_id'
        switch-bandwidth:
          type: number
        switch-health:
          type: number
        switch-throughput:
          type: number
      required:
      - site_id
      - switch-health
      type: object
    insight_metrics_results_item:
      anyOf:
      - type: number
      - additionalProperties: true
        type: object
    response_http400:
      additionalProperties: false
      properties:
        detail:
          examples:
          - 'JSON parse error - Expecting value: line 5 column 8 (char 56)'
